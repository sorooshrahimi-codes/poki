    <style>html,body{touch-action:none;-webkit-user-select:none;user-select:none;background:#05060a;height:100%;margin:0;overflow:hidden}canvas#gl{width:100%;height:100%;display:block;position:fixed;top:0;bottom:0;left:0;right:0}canvas#hud{pointer-events:none;display:none;position:fixed;bottom:8px;left:8px}body{color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif}#count{left:max(14px, env(safe-area-inset-left));top:max(10px, env(safe-area-inset-top));letter-spacing:.5px;text-shadow:0 0 14px #ffbe5acc,0 2px 6px #0009;pointer-events:none;align-items:center;gap:8px;font-size:28px;font-weight:800;display:flex;position:fixed}#count i{background:radial-gradient(circle,#fff6c8,#ffb648 55%,#ff962800 70%);border-radius:50%;width:14px;height:14px;animation:1.6s ease-in-out infinite pulse;box-shadow:0 0 18px 6px #ffaa3c99}#count.pop{animation:.35s bump}#goal{left:50%;top:max(16px, env(safe-area-inset-top));pointer-events:none;background:#78788c59;border-radius:6px;width:min(46vw,360px);height:10px;position:fixed;overflow:hidden;translate:-50%;box-shadow:0 0 0 1px #ffffff1f}#goal b{background:linear-gradient(90deg,#6fdc5a,#ffe17a,#ff9ad1);width:0%;height:100%;transition:width .4s;display:block;box-shadow:0 0 12px #a0ff78cc}#hand{pointer-events:none;filter:drop-shadow(0 4px 8px #00000080);width:64px;height:64px;font-size:54px;animation:2.4s ease-in-out infinite drag;position:fixed;top:62%;left:50%}@keyframes drag{0%{transform:translate(-80px)}50%{transform:translate(70px,-30px)}to{transform:translate(-80px)}}@keyframes pulse{50%{transform:scale(1.25)}}@keyframes bump{40%{transform:scale(1.18)}}canvas#fx{pointer-events:none;width:100%;height:100%;position:fixed;top:0;bottom:0;left:0;right:0}#left{left:max(14px, env(safe-area-inset-left));top:calc(max(10px, env(safe-area-inset-top)) + 40px);text-shadow:0 2px 6px #0009;pointer-events:none;font-size:20px;font-weight:800;position:fixed}#boss{left:50%;top:calc(max(16px, env(safe-area-inset-top)) + 22px);pointer-events:none;opacity:0;background:#280a0a99;border-radius:9px;width:min(70vw,520px);height:16px;transition:opacity .5s;position:fixed;overflow:hidden;translate:-50%;box-shadow:0 0 0 2px #ff785a99}#boss.on{opacity:1}#boss b{background:linear-gradient(90deg,#ff3b2f,#ff9a3c);width:100%;height:100%;transition:width .15s;display:block}#boss.hit{box-shadow:0 0 0 3px #fff,0 0 24px 6px #ff3c28e6}#combo{color:#ffe27a;text-shadow:0 0 20px #ffaa3ce6,0 4px #8a3b00;pointer-events:none;opacity:0;font-size:64px;font-weight:900;position:fixed;top:22%;left:50%;translate:-50%}#combo.pop{animation:.9s ease-out combo}@keyframes combo{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.25)}30%{transform:scale(1)}to{opacity:0;transform:scale(1)translateY(-30px)}}#timer{left:50%;top:calc(max(16px, env(safe-area-inset-top)) + 16px);text-shadow:0 2px 8px #000000b3;pointer-events:none;font-size:26px;font-weight:900;position:fixed;translate:-50%}#timer.hurry{color:#ff6a5a;animation:.5s infinite bump}#board{right:max(12px, env(safe-area-inset-right));top:calc(max(10px, env(safe-area-inset-top)) + 34px);text-shadow:0 2px 5px #000000b3;pointer-events:none;flex-direction:column;gap:3px;font-size:15px;font-weight:800;display:flex;position:fixed}#board div{opacity:.85;align-items:center;gap:6px;display:flex}#board div.me{opacity:1;font-size:18px}#board i{border-radius:50%;width:11px;height:11px;box-shadow:0 0 8px}#rank{background:#0a081499;border-radius:22px;flex-direction:column;align-items:stretch;gap:6px;min-width:220px;padding:14px 20px;display:flex}#rank .st{text-align:center;color:#ffd76a;text-shadow:0 0 18px #ffc850e6;letter-spacing:6px;font-size:44px}#rank .row{opacity:.8;align-items:center;gap:12px;font-size:26px;font-weight:800;display:flex}#rank .row b{margin-left:auto}#rank .row.me{opacity:1;color:#ffe27a}#fade{opacity:0;pointer-events:none;background:#0a0810;transition:opacity .5s;position:fixed;top:0;bottom:0;left:0;right:0}#fade.on{opacity:1}.gone{opacity:0;transition:opacity .8s}#win{pointer-events:none;opacity:0;flex-direction:column;justify-content:center;align-items:center;gap:18px;transition:opacity .6s;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#win.show{opacity:1;pointer-events:auto}#win .stars{filter:drop-shadow(0 0 18px #ffdc78e6);font-size:64px;animation:1.2s ease-in-out infinite bump}#path{background:#0a081473;border-radius:40px;align-items:center;gap:6px;padding:10px 18px;font-size:40px;display:flex}#path span{filter:grayscale()brightness(.55);transition:filter .6s}#path span.done{filter:drop-shadow(0 0 10px #ffdc78e6)}#path span.next{filter:grayscale(.6)brightness(.9);animation:1s ease-in-out infinite bump;display:inline-block}#path i{background:#ffffff4d;border-radius:2px;width:16px;height:4px}#path b{color:#ffd76a;margin-left:6px;font-size:24px}#row{align-items:center;gap:22px;display:flex}#win #boost{background:radial-gradient(circle at 35% 30%,#fff8,#fff0 40%),linear-gradient(#c58cff,#7a3cff);width:84px;height:84px;font-size:30px;box-shadow:0 0 30px #aa6effcc}#win #boost.used{opacity:.25;pointer-events:none}#win button{cursor:pointer;color:#fff;background:radial-gradient(circle at 35% 30%,#fff8,#fff0 40%),linear-gradient(#ffcf6a,#ff8a3d);border:0;border-radius:50%;width:110px;height:110px;font-size:44px;box-shadow:0 0 40px #ffaa50cc}</style>
