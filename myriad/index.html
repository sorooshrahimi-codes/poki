<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Glowmites</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; touch-action: none; user-select: none; -webkit-user-select: none; }
      canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      canvas#hud { position: fixed; left: 8px; bottom: 8px; pointer-events: none; display: none; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
      #count { position: fixed; left: max(14px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; font-size: 28px; font-weight: 800; letter-spacing: 0.5px; text-shadow: 0 0 14px rgba(255, 190, 90, 0.8), 0 2px 6px rgba(0, 0, 0, 0.6); pointer-events: none; }
      #count i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, #fff6c8, #ffb648 55%, rgba(255, 150, 40, 0) 70%); box-shadow: 0 0 18px 6px rgba(255, 170, 60, 0.6); animation: pulse 1.6s ease-in-out infinite; }
      #count.pop { animation: bump 0.35s; }
      #goal { position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top)); translate: -50% 0; width: min(46vw, 360px); height: 10px; border-radius: 6px; background: rgba(120, 120, 140, 0.35); overflow: hidden; pointer-events: none; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12); }
      #goal b { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #6fdc5a, #ffe17a, #ff9ad1); box-shadow: 0 0 12px rgba(160, 255, 120, 0.8); transition: width 0.4s; }
      #hand { position: fixed; left: 50%; top: 62%; width: 64px; height: 64px; font-size: 54px; pointer-events: none; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); animation: drag 2.4s ease-in-out infinite; }
      @keyframes drag { 0% { transform: translate(-80px, 0); } 50% { transform: translate(70px, -30px); } 100% { transform: translate(-80px, 0); } }
      @keyframes pulse { 50% { transform: scale(1.25); } }
      @keyframes bump { 40% { transform: scale(1.18); } }
      #fade { position: fixed; inset: 0; background: #0a0810; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
      #fade.on { opacity: 1; }
      .gone { opacity: 0; transition: opacity 0.8s; }
      #win { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; pointer-events: none; opacity: 0; transition: opacity 0.6s; }
      #win.show { opacity: 1; pointer-events: auto; }
      #win .stars { font-size: 64px; filter: drop-shadow(0 0 18px rgba(255, 220, 120, 0.9)); animation: bump 1.2s ease-in-out infinite; }
      #path { display: flex; align-items: center; gap: 6px; font-size: 40px; padding: 10px 18px; border-radius: 40px; background: rgba(10, 8, 20, 0.45); }
      #path span { filter: grayscale(1) brightness(0.55); transition: filter 0.6s; }
      #path span.done { filter: drop-shadow(0 0 10px rgba(255, 220, 120, 0.9)); }
      #path span.next { filter: grayscale(0.6) brightness(0.9); animation: bump 1s ease-in-out infinite; display: inline-block; }
      #path i { width: 16px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); }
      #path b { font-size: 24px; color: #ffd76a; margin-left: 6px; }
      #row { display: flex; gap: 22px; align-items: center; }
      #win #boost { width: 84px; height: 84px; font-size: 30px; background: radial-gradient(circle at 35% 30%, #fff8, #fff0 40%), linear-gradient(#c58cff, #7a3cff); box-shadow: 0 0 30px rgba(170, 110, 255, 0.8); }
      #win #boost.used { opacity: 0.25; pointer-events: none; }
      #win button { font-size: 44px; width: 110px; height: 110px; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
        background: radial-gradient(circle at 35% 30%, #fff8, #fff0 40%), linear-gradient(#ffcf6a, #ff8a3d); box-shadow: 0 0 40px rgba(255, 170, 80, 0.8); }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="hud" width="300" height="120"></canvas>
    <div id="count"><i></i><span id="countN">300</span></div>
    <div id="goal"><b id="goalFill"></b></div>
    <div id="fade"></div>
    <div id="hand">👆</div>
    <div id="win"><div id="path"></div><div id="row"><button id="boost">🎬✨</button><button id="next">▶</button></div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
