<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Deep Luck</title>
    <!-- Poki SDK: the only script from another host, as Poki requires. Missing offline is fine. -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading"><div class="logo">Deep<br><span>Luck</span></div><div class="lb"><div id="loadBar"></div></div></div>
    <div id="ui">
      <div id="top">
        <div class="pill" id="coins"><span class="ico" id="coinIco">🪙</span><b id="coinsN">0</b></div>
        <button class="pill btn" id="albumBtn"><span class="ico">📖</span><b id="albumN">0/0</b></button>
        <button class="pill btn hidden" id="lvlPill"><span class="lvring" id="lvlBar"><span>⭐</span></span><b id="lvlN">1</b><span id="voyN"></span></button>
        <div class="spacer"></div>
        <div id="status"><div class="pill hidden" id="playPill"></div><button class="pill btn hidden" id="baitPill"></button><div class="pill hidden" id="eventPill"></div><div class="pill" id="weatherPill"></div></div>
        <button class="pill btn round" id="gearBtn">⚙️</button>
      </div>
      <div id="tray" class="hidden"><button class="pill btn round" id="langBtn"></button><button class="pill btn round" id="muteBtn">🔊</button><button class="pill btn round" id="pauseBtn">⏸</button></div>
      <div id="gauge"><div class="gline"><div id="gaugeFill"><i class="ghook">🪝</i></div></div><div id="gaugeFish"></div><b id="gaugeStar"></b></div>
      <div id="diveHud" class="hidden">
        <div class="pill" id="depthN">0m</div>
        <div class="pill" id="slots"></div>
      </div>
      <div id="side"><div id="zones"></div><button class="btn zone shopb round2" id="wardBtn">🎩</button><button class="btn zone shopb round2 hidden" id="duelBtn">🤝</button></div>
      <div id="haul" class="hidden"></div>
      <div id="pop" class="hidden"></div>
      <button class="btn ad hidden" id="doubleBtn">🎬<b>×2</b></button>
      <div id="dock">
        <div id="mission" class="hidden"></div>
        <div id="dockRow" class="hidden"><button class="btn zone shopb hidden" id="mapBtn"><img src="./art/g_map.webp" alt=""><b id="mapN">0/3</b></button><button class="btn zone shopb round2 hidden" id="aquaBtn">🐠<span id="aquaBadge" class="badge hidden"></span></button><button class="btn zone shopb round2 hidden" id="competeBtn">🏆</button><button class="btn zone shopb round2 hidden" id="ordersBtn">📋<span id="ordersBadge" class="hidden"></span></button><button class="btn zone shopb round2 hidden" id="wheelBtn">🎁<span id="wheelBadge" class="badge hidden">!</span></button><button class="btn zone shopb round2 hidden" id="crewBtn">🧭<span id="crewBadge" class="badge hidden">!</span></button><button class="btn zone shopb hidden" id="shopBtn"><img src="./art/g_shop.webp" alt=""></button></div>
        <div id="upgrades"></div>
      </div>
      <div id="logbook" class="hidden"><div class="lbpage"><img id="lbCaptain" src="./art/npc_captain.webp" alt=""><div id="lbRoad"></div></div></div>
      <div id="snap" class="panel hidden">
        <div class="title" id="snapTitle"></div>
        <canvas id="snapFish" width="200" height="110"></canvas>
        <div class="row">
          <button class="btn big ad" id="retryBtn">🎬 <span id="retryLbl"></span></button>
          <button class="btn big plain" id="letgoBtn"></button>
        </div>
      </div>
      <div id="wardrobe" class="panel hidden">
        <div class="title">🎩 🐾</div>
        <canvas id="wardPreview" width="240" height="190"></canvas>
        <div id="wardNote"></div>
        <div id="wardGrid"></div>
        <button class="btn big ok" id="wardClose">✕</button>
      </div>
      <div id="aquarium" class="panel hidden">
        <div class="title" id="aquaTitle">🐠</div>
        <canvas id="aquaCanvas" width="360" height="240"></canvas>
        <div id="aquaEarn"></div>
        <div id="aquaHint"></div>
        <div id="tankList"></div>
        <div class="row"><button class="btn big ad" id="aquaDouble">🎬 x2</button><button class="btn big ok" id="aquaCollect"></button></div>
        <button class="btn big plain" id="aquaClose">✕</button>
      </div>
      <div id="compete" class="panel hidden">
        <div id="cmpProfile"></div>
        <div id="cmpList">
          <div id="cmpLeague" class="crow3"></div>
          <div id="cmpDerby" class="crow3"><span class="ci">🏆</span><span class="cd"></span><button class="btn gold" id="derbyBtn"></button><button class="btn ad hidden" id="derbySkip">🎬⏩</button></div>
          <div id="cmpDaily" class="crow3"><span class="ci">🌅</span><span class="cd"></span><button class="btn gold" id="dailyBtn">▶</button></div>
          <div id="cmpDuel" class="crow3"><span class="ci">🤝</span><span class="cd" id="chDesc"></span><button class="btn ok" id="chBtn">▶</button></div>
          <div id="cmpVoyage" class="crow3"><span class="ci">⛵</span><span class="cd"></span><button class="btn gold" id="voyBtn">⛵</button></div>
        </div>
        <div id="cmpTable" class="hidden"></div>
        <button class="btn big plain" id="competeClose">✕</button>
      </div>
      <div id="result" class="panel hidden">
        <div class="title" id="resultTitle"></div>
        <div id="resultBody"></div>
        <div id="resultFoot"></div>
        <button class="btn big ok hidden" id="resultPlay">▶</button>
        <button class="btn big gold hidden" id="resultAct">📤</button>
        <button class="btn big ok" id="resultClose">OK</button>
      </div>
      <div id="wheel" class="panel hidden">
        <div class="title">🎡</div>
        <div id="wheelWrap"><canvas id="wheelCv" width="560" height="560"></canvas><div id="wheelPtr">▼</div></div>
        <div id="wheelNote"></div>
        <div class="row"><button class="btn big gold" id="wheelSpin"></button><button class="btn big ad" id="wheelAd">🎬 🎡</button></div>
        <button class="btn big ok" id="wheelClose">✕</button>
      </div>
      <div id="crew" class="panel hidden">
        <div class="title">🧭</div>
        <div id="crewNote"></div>
        <div id="crewList"></div>
        <button class="btn big ok" id="crewClose">✕</button>
      </div>
      <div id="orders" class="panel hidden">
        <div class="title">📋</div>
        <div id="ordersNote"></div>
        <div id="orderList"></div>
        <button class="btn big ok" id="ordersClose">✕</button>
      </div>
      <div id="map" class="hidden">
        <canvas id="wmapCanvas"></canvas>
        <div id="mapCard"></div>
        <button class="btn round2 plain" id="mapClose">✕</button>
      </div>
      <div id="shop" class="panel hidden">
        <div class="title"><img class="ti" src="./art/g_shop.webp" alt=""> <span id="restock"></span></div>
        <div id="myGear"></div>
        <div id="offers"></div>
        <div id="gearRow"></div>
        <button class="btn big ok" id="shopClose">✕</button>
      </div>
      <div id="album" class="panel hidden">
        <div class="title"><span id="albumTitle"></span> <span id="albumCount"></span></div>
        <div id="albumGrid"></div>
        <button class="btn big ok" id="albumClose">✕</button>
      </div>
      <div id="pause" class="hidden">
        <button class="btn big ok" id="resumeBtn"></button>
      </div>
      <div id="legend" class="hidden"><div class="rays"></div><div class="lr" id="legendRarity"></div><div id="legendFish"></div><div class="ln" id="legendName"></div></div>
      <div id="langPanel" class="panel hidden"><div class="title">🌐</div><div id="langList"></div><button class="btn big plain" id="langClose">✕</button></div>
      <div id="guide" class="hidden"><span class="port" id="guidePort"><img src="./art/npc_captain.webp" alt=""></span><div id="guideText"></div></div>
      <div id="toast" class="hidden"></div>
      <div id="reelHint" class="hidden"></div>
    </div>
    <script type="module" src="./src/boot.ts"></script>
  </body>
</html>
